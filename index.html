<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GalacticIPA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --accent1:#ff3b3f;
    --accent2:#ff7b25;
    --bg1:#071026;
    --bg2:#0b1026;
    --card:#141428;
    --muted:#a0a0b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter, "Segoe UI", Roboto, system-ui, -apple-system;}
  body{
    background: radial-gradient(1200px 600px at 10% 10%, rgba(80,100,255,0.06), transparent),
                linear-gradient(135deg,var(--bg1) 0%, var(--bg2) 100%);
    color:#eef0f6;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .container{max-width:1100px;margin:0 auto;padding:20px;}
  header{padding:28px 0;text-align:center;border-bottom:1px solid rgba(255,255,255,0.03);}
  .logo{font-size:2.8rem;font-weight:800;background:linear-gradient(45deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline{color:var(--muted);margin-top:6px}
  nav{position:sticky;top:8px;background:rgba(8,10,20,0.45);backdrop-filter: blur(6px);padding:12px;border-radius:12px;margin:16px 0}
  .nav-container{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .nav-btn{background:linear-gradient(135deg,#1f2133,#151623);padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.03);color:#e9ecff;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
  .nav-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.6)}
  .top-search{display:flex;gap:12px;align-items:center;margin:22px 0}
  .search{position:relative;flex:1}
  .search input{width:100%;padding:12px 14px 12px 40px;border-radius:999px;border:1px solid rgba(255,255,255,0.04);background:rgba(12,14,26,0.6);color:#fff}
  .search .fa-search{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:24px}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}
  .section-title{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:1.1rem;color:var(--accent2)}
  /* IPA grid */
  .ipa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .ipa-card{background:linear-gradient(180deg,var(--card),#0f1220);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid rgba(255,255,255,0.03);cursor:pointer}
  .ipa-card h3{color:var(--accent2);font-size:1.05rem}
  .ipa-card p{color:var(--muted);font-size:.95rem;flex:1}
  .card-footer{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .download-btn{background:linear-gradient(90deg,var(--accent1),var(--accent2));border:none;color:#fff;padding:8px 12px;border-radius:12px;cursor:pointer}
  .download-btn:active{transform:scale(.99)}
  /* pagination */
  .pagination{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px}
  .page-btn{padding:8px 11px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.02);color:#ddd;cursor:pointer}
  .page-btn.active{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
  .arrow{font-weight:700;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.02);cursor:pointer}
  /* side column */
  .side-card{background:linear-gradient(180deg,#0e1220,#0b0f1a);padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.02)}
  .blogs{display:flex;flex-direction:column;gap:12px}
  .blog-post{padding:12px;background:rgba(255,255,255,0.02);border-radius:8px}
  .blog-title{font-weight:700;color:var(--accent1)}
  /* modal */
  .modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(2,6,20,0.75);display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-content{background:#0f1120;padding:22px;border-radius:12px;max-width:680px;width:100%;border:1px solid rgba(255,255,255,0.04)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .modal-head h2{margin:0;color:var(--accent2)}
  .close{background:transparent;border:none;color:#fff;font-size:1.2rem;cursor:pointer}
  .download-options{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .download-link{padding:10px;border-radius:8px;background:linear-gradient(180deg,#1c1d2a,#12121b);color:#eaf0ff;text-decoration:none;border:1px solid rgba(255,255,255,0.03)}
  footer{margin-top:32px;padding:20px;color:#9aa0b6;text-align:center}
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">GalacticIPA</div>
      <div class="tagline">Your ultimate IPA hub</div>
    </header>

    <nav>
      <div class="nav-container">
        <button class="nav-btn" onclick="scrollToSection('music')"><i class="fas fa-music"></i> Music</button>
        <button class="nav-btn" onclick="scrollToSection('games')"><i class="fas fa-gamepad"></i> Games</button>
        <button class="nav-btn" onclick="scrollToSection('tools')"><i class="fas fa-tools"></i> Tools</button>
        <button class="nav-btn" onclick="scrollToSection('request')"><i class="fas fa-paper-plane"></i> Request</button>
      </div>
    </nav>

    <div class="top-search">
      <div class="search">
        <i class="fas fa-search"></i>
        <input id="searchBarTop" placeholder="Search IPAs by name..." oninput="filterCards()" />
      </div>
    </div>

    <div class="layout">
      <main>
        <section>
          <div class="section-title" id="music"><i class="fas fa-music"></i> Featured & Music</div>

          <div id="ipaGrid" class="ipa-grid"><!-- cards rendered here --></div>

          <div class="pagination" id="pagination">
            <button class="arrow" onclick="prevPage()" title="Previous"><i class="fas fa-chevron-left"></i></button>
            <div id="pageNumbers" style="display:flex;gap:6px;align-items:center"></div>
            <button class="arrow" onclick="nextPage()" title="Next"><i class="fas fa-chevron-right"></i></button>
          </div>
        </section>

        <section style="margin-top:28px">
          <div class="section-title" id="games"><i class="fas fa-gamepad"></i> Games</div>
          <p style="color:var(--muted);margin-bottom:12px">(All apps are shown in the paginated list above — use search & pages.)</p>
        </section>

        <section style="margin-top:28px" id="request">
          <div class="section-title"><i class="fas fa-pen"></i> Blog</div>
          <div id="blogList" class="blogs"></div>
          <div class="pagination" id="blogPagination" style="margin-top:10px"></div>
        </section>
      </main>

      <aside>
        <div class="side-card">
          <h4 style="margin-bottom:10px;color:var(--accent1)">Quick Links</h4>
          <div style="display:flex;flex-direction:column;gap:8px">
            <a class="download-link" href="https://t.me/GalaticIPA" target="_blank">Join Telegram</a>
            <a class="download-link" href="#" onclick="alert('Use the search or click an app to open download options')">How to install IPAs</a>
          </div>
        </div>

        <div class="side-card" style="margin-top:16px">
          <h4 style="margin-bottom:10px;color:var(--accent1)">Recent Blog</h4>
          <div id="recentBlogs"></div>
        </div>
      </aside>
    </div>

    <div id="ipaModal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 id="modalTitle">App</h2>
          <button class="close" onclick="closeModal()">&times;</button>
        </div>
        <p id="modalDescription" style="color:var(--muted);margin-top:8px">Description</p>
        <div class="download-options" id="modalDownloads"></div>
      </div>
    </div>

    <footer>
      <div>© 2025 GalacticIPA — All rights reserved.</div>
    </footer>
  </div>

<script>
/* ---------- IPA DATA (add/remove entries here) ---------- */
const ipaData = [

    {label:'CapCut (Primary)', url:'https://file.ipaomtk.com/ipa/CapCut.ipa'},

  ]},

  { key:'minecraft', title:'Minecraft', desc:'Block-building survival & adventure.', downloads:[
    {label:'Minecraft v1.21.111', url:'https://dl.iosvizor.net/minecraft/Minecraft_v1.21.111_iosvizor_.ipa'},
    {label:'Minecraft (IPAOMTK)', url:'https://s1.ipaomtk.com/ipa/Minecraft-IPAOMTK.COM.ipa'}
  ]},

  { key:'subway', title:'Subway Surfers', desc:'Endless runner through subways.', downloads:[
    {label:'Download', url:'https://file.ipaomtk.com/ipa/Subway-Surfers-ipaomtk.com.ipa'}
  ]},

  { key:'scarlet', title:'Scarlet IPA', desc:'Custom ScarletAlpha build.', downloads:[
    {label:'ScarletAlpha', url:'https://raw.githubusercontent.com/coolzyycmon/IPAs/main/ScarletAlpha.ipa'}
  ]},

  { key:'esign', title:'ESign IPA', desc:'Sign documents offline/no logs.', downloads:[
    {label:'ESignNoLogs', url:'https://raw.githubusercontent.com/coolzyycmon/IPAs/main/ESignNoLogs-5.0-1.1.ipa'}
  ]},

  { key:'chatgpt', title:'ChatGPT IPA', desc:'ChatGPT iOS package.', downloads:[
    {label:'ChatGPT IPA', url:'https://raw.githubusercontent.com/coolzyycmon/IPAs/main/ChatGPT_1.0_1750971508.ipa'}
  ]},

  { key:'trollx', title:'TrollInstallerX', desc:'Installer with tweaks.', downloads:[
    {label:'TrollInstallerX', url:'https://raw.githubusercontent.com/coolzyycmon/IPAs/main/TrollInstallerX.ipa'}
  ]},

  { key:'gta', title:'GTA: San Andreas', desc:'Multiple versions available.', downloads:[
    {label:'Normal', url:'https://file.ipaomtk.com/ipa/GTA-San-Andreas-ipaomtk.com.ipa'},
    {label:'Original', url:'https://s1.ipaomtk.com/ipa/GTA-SA-Original.ipa'},
    {label:'Mod Version', url:'https://s1.ipaomtk.com/ipa/GTASA-MOD-IPAOMTK.COM.ipa'},
    {label:'HD', url:'https://file.ipaomtk.com/ipa/GTA-SA-MOD-HD.ipa'},
    {label:'Definitive', url:'https://file.ipaomtk.com/ipa/GTA-SA-Definitive-ipaomtk.com.ipa'}
  ]},

  { key:'shadow2', title:'Shadow Fight 2', desc:'Martial arts fighting game.', downloads:[
    {label:'Shadow Fight 2 (2.41.6)', url:'https://file.ipaomtk.com/ipa/Shadow-Fight-2.ipa'}
  ]},

  { key:'shadow3', title:'Shadow Fight 3', desc:'RPG Fighting (updated build).', downloads:[
    {label:'Shadow Fight 3 (1.42.2)', url:'https://file.ipaomtk.com/ipa/Shadow-Fight-3-1.40.0.ipa'}
  ]},

  { key:'steps', title:'StepsApp Pedometer', desc:'Steps tracking & pedometer.', downloads:[
    {label:'StepsApp v8.4.4', url:'https://s1.ipaomtk.com/ipa/StepsApp-Pedometer-IPAOMTK.COM.ipa'}
  ]},

  { key:'spotify', title:'Spotify Music & Podcasts', desc:'Spotify (updated).', downloads:[
    {label:'Spotify v9.0.82', url:'https://file.ipaomtk.com/ipa/Spotify-ipaomtk.com.ipa'}
  ]},

  { key:'yt_oled', title:'YouTube (OLED)', desc:'YouTube OLED build (v20.39.4)', downloads:[
    {label:'YouTube OLED', url:'https://file.ipaomtk.com/ipa/YouTube-OLED-19.46.3-ipaomtk.com.ipa'}
  ]},

  { key:'photomath', title:'Photomath', desc:'Solve math problems with camera.', downloads:[
    {label:'Photomath v8.45.0', url:'https://s1.ipaomtk.com/ipa/Photomath-IPAOMTK.COM.ipa'}
  ]},

  { key:'feather', title:'Feather', desc:'Lightweight Twitter/X client (Feather).', downloads:[
    {label:'Feather v2.4.0', url:'https://github.com/khcrysalis/Feather/releases/download/v2.4.0/Feather.ipa'}
  ]},

  { key:'terabox', title:'TeraBox++', desc:'TeraBox Premium modified.', downloads:[
    {label:'TeraBox++', url:'https://archive.org/download/captions-12.36.1-15.0-le-ti/TeraBox++_4.5.5_15.0_LeTi.ipa'}
  ]},

  { key:'inshot', title:'InShot++', desc:'InShot Pro modified.', downloads:[
    {label:'InShot++', url:'https://archive.org/download/captions-12.36.1-15.0-le-ti/InShot++_1.90.1_15.0_LeTi.ipa'}
  ]},

  { key:'captionspp', title:'Captions++', desc:'Captions Max modified.', downloads:[
    {label:'Captions++', url:'https://archive.org/download/captions-12.36.1-15.0-le-ti/Captions++_12.36.1_15.0_LeTi.ipa'}
  ]},

  { key:'ispoofer', title:'iSpoofer', desc:'Location spoofing (signed).', downloads:[
    {label:'iSpoofer Signed', url:'https://ispoofer.app/Signed.ipa'}
  ]},

  { key:'diamond', title:'Diamond Finder (Minecraft)', desc:'Find diamonds easily in Minecraft.', downloads:[
    {label:'Diamond Finder', url:'https://file.ipaomtk.com/ipa/diamond-finder-for-minecraft.ipa'}
  ]},

  { key:'moviebox', title:'MovieBox Pro', desc:'Stream movies & TV.', downloads:[
    {label:'MovieBox Pro', url:'https://www.movieboxpro.app/ipa'}
  ]},

  { key:'geometry', title:'Geometry Dash', desc:'Rhythm-based platformer.', downloads:[
    {label:'Geometry Dash v2.206', url:'https://dl.iosvizor.net/geometry-dash/Geometry-Dash-v2.206-iosvizor.ipa'}
  ]},

  { key:'blockblast', title:'Block Blast!', desc:'Block puzzle game.', downloads:[
    {label:'Block Blast', url:'https://s1.ipaomtk.com/ipa/Block-Blast!-IPAOMTK.COM.ipa'}
  ]},

  { key:'captions', title:'Captions', desc:'Add captions to video.', downloads:[
    {label:'Captions IPA', url:'https://s1.ipaomtk.com/ipa/Captions-IPAOMTK.COM.ipa'}
  ]},

  { key:'rsboxing', title:'RS Boxing Champions', desc:'Boxing fighting game.', downloads:[
    {label:'RS Boxing', url:'https://file.ipaomtk.com/ipa/RealSteelBoxing.ipa'}
  ]},

  { key:'flightradar', title:'Flightradar24', desc:'Track flights in real-time.', downloads:[
    {label:'Flightradar24', url:'https://file.ipaomtk.com/ipa/Flightradar24.ipa'}
  ]},

  { key:'myfitness', title:'MyFitnessPal', desc:'Calorie Counter — MyFitnessPal v25.39.0', downloads:[
    {label:'MyFitnessPal v25.39.0', url:'https://s1.ipaomtk.com/ipa/MyFitnessPal-IPAOMTK.COM.ipa'}
  ]}
];

/* ---------- blog data (simple) ---------- */
const blogPosts = [
  {id:1,title:'Welcome to GalacticIPA', excerpt:'We host curated IPA links. Learn how to install and keep safe.', body:'Full post content for welcome...'},
  {id:2,title:'How to sideload IPAs safely', excerpt:'Basics on AltStore & certificate tips.', body:'Full how-to content...'},
  {id:3,title:'Top 10 Mods this month', excerpt:'Hot modified IPAs trending now.', body:'Full list...'},
  {id:4,title:'Troubleshooting downloads', excerpt:'What to do when a .ipa won’t download or install.', body:'Troubleshooting content...'},
  {id:5,title:'Why backups matter', excerpt:'Always make backups before installing modified apps.', body:'Backup instructions...'}
];

/* ---------- pagination settings ---------- */
let currentPage = 1;
const perPage = 8; // cards per page
let filtered = ipaData.slice(); // current filtered list

/* ---------- render functions ---------- */
function renderCards(){
  const grid = document.getElementById('ipaGrid');
  grid.innerHTML = '';
  const start = (currentPage-1)*perPage;
  const end = start + perPage;
  const pageItems = filtered.slice(start,end);
  if(pageItems.length===0 && currentPage>1){ currentPage=1; renderCards(); return; }
  pageItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='ipa-card';
    div.onclick = ()=> openModal(item.key);
    div.innerHTML = `<h3>${escapeHtml(item.title)}</h3>
                     <p>${escapeHtml(item.desc)}</p>
                     <div class="card-footer">
                       <span>${item.downloads[0].label}</span>
                       <button class="download-btn" onclick="event.stopPropagation(); openModal('${item.key}')">Download</button>
                     </div>`;
    grid.appendChild(div);
  });
  renderPagination();
}

/* pagination display */
function renderPagination(){
  const pageNumbers = document.getElementById('pageNumbers');
  pageNumbers.innerHTML = '';
  const total = Math.ceil(filtered.length / perPage) || 1;
  const maxShow = 7;
  let start = Math.max(1, currentPage - Math.floor(maxShow/2));
  let end = Math.min(total, start + maxShow - 1);
  if(end - start < maxShow - 1) start = Math.max(1, end - maxShow + 1);
  for(let i=start;i<=end;i++){
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i===currentPage ? ' active':'' );
    btn.textContent = i;
    btn.onclick = ()=>{ currentPage=i; renderCards(); };
    pageNumbers.appendChild(btn);
  }
}
function prevPage(){ if(currentPage>1){ currentPage--; renderCards(); } }
function nextPage(){ const total = Math.ceil(filtered.length / perPage); if(currentPage<total){ currentPage++; renderCards(); } }

/* filter/search */
function filterCards(){
  const q = (document.getElementById('searchBarTop').value || '').trim().toLowerCase();
  if(!q){ filtered = ipaData.slice(); }
  else { filtered = ipaData.filter(i => i.title.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)); }
  currentPage = 1;
  renderCards();
}

/* modal logic */
function openModal(key){
  const item = ipaData.find(i => i.key === key);
  if(!item) return;
  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalDescription').textContent = item.desc;
  const downloads = document.getElementById('modalDownloads');
  downloads.innerHTML = '';
  item.downloads.forEach(d=>{
    const a = document.createElement('a');
    a.className='download-link';
    a.href = d.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = d.label + ' →';
    downloads.appendChild(a);
  });
  document.getElementById('ipaModal').style.display = 'flex';
  document.getElementById('ipaModal').setAttribute('aria-hidden','false');
}
function closeModal(){
  document.getElementById('ipaModal').style.display = 'none';
  document.getElementById('ipaModal').setAttribute('aria-hidden','true');
}
window.onclick = (e) => { if(e.target === document.getElementById('ipaModal')) closeModal(); };

/* blog rendering with simple pagination */
let blogPage = 1;
const blogPer = 2;
function renderBlog(){
  const start = (blogPage-1)*blogPer;
  const slice = blogPosts.slice(start,start+blogPer);
  const list = document.getElementById('blogList');
  list.innerHTML = '';
  slice.forEach(p=>{
    const el = document.createElement('div');
    el.className='blog-post';
    el.innerHTML = `<div class="blog-title">${escapeHtml(p.title)}</div>
                    <div style="color:var(--muted);margin-top:6px">${escapeHtml(p.excerpt)}</div>
                    <div style="margin-top:8px"><a class="download-link" href="#" onclick="alert('Open full post in editor — replace with real posts')">Read more</a></div>`;
    list.appendChild(el);
  });
  // small recent list
  const recent = document.getElementById('recentBlogs');
  recent.innerHTML = blogPosts.slice(0,3).map(b=>`<div style="color:var(--muted);margin-bottom:8px">${escapeHtml(b.title)}</div>`).join('');
  // blog pagination
  const blogPg = document.getElementById('blogPagination');
  blogPg.innerHTML = '';
  const total = Math.ceil(blogPosts.length / blogPer);
  if(total<=1) return;
  const prev = document.createElement('button'); prev.className='page-btn'; prev.textContent='Prev'; prev.onclick=()=>{ if(blogPage>1) { blogPage--; renderBlog(); } };
  const next = document.createElement('button'); next.className='page-btn'; next.textContent='Next'; next.onclick=()=>{ if(blogPage<total){ blogPage++; renderBlog(); } };
  blogPg.appendChild(prev);
  for(let i=1;i<=total;i++){
    const b = document.createElement('button'); b.className='page-btn'+(i===blogPage?' active':''); b.textContent=i; b.onclick=(()=>{const n=i; return ()=>{blogPage=n; renderBlog();}})();
    blogPg.appendChild(b);
  }
  blogPg.appendChild(next);
}

/* small helper */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, (m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]); }

/* initial render */
renderCards();
renderBlog();

/* Expose functions for console/testing */
window.filterCards = filterCards;
window.openModal = openModal;
window.closeModal = closeModal;
window.prevPage = prevPage;
window.nextPage = nextPage;
window.scrollToSection = id => document.getElementById(id)?.scrollIntoView({behavior:'smooth'});
</script>
</body>
</html>
